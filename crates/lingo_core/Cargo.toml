[package]
name = "lingo_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "lingo_core"
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rusqlite = { version = "0.32", features = ["bundled"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
